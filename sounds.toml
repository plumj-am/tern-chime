# Chime sounds: alert, yield and done take a path to an audio file.
# Paths are relative to this file when the config lives in the plugin folder
# (sounds/... reach the bundled chimes); use absolute or ~/ paths in
# <plugin data>/sounds.toml, which overrides this file. An empty path ("")
# silences that trigger.
#
# Windows plays WAV only (Media.SoundPlayer); macOS plays whatever afplay
# reads; Linux plays whatever the detected player reads: pw-play, paplay,
# aplay, ffplay or play, first found wins. Of those, only pw-play, paplay,
# ffplay and play take the volume below; aplay and Windows have no volume
# control. Edit freely; Chime re-reads the config every few seconds and the
# Reload palette command refreshes it at once.
alert = "sounds/alert.wav"
yield = "sounds/yield.wav"
done = "sounds/done.wav"

# Chime only for panes you are not looking at. false chimes for the focused
# pane too.
only_unfocused = true

# Shell commands running at least this long chime the done sound when they
# finish. 0 chimes every finished command.
min_seconds = 30

# Playback volume in percent, 1 to 100. 100 is normal volume. Tools with no
# volume control ignore it: Windows (Media.SoundPlayer) and Linux aplay always
# play at full volume, and iOS stays silent. Chime muting is a separate
# palette command.
volume = 100
